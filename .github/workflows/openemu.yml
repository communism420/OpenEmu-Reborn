name: OpenEmu.app

on:
  workflow_dispatch:

jobs:
  build:
    name: Build OpenEmu (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-26
          - arch: x86_64
            runner: macos-26-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.5'
      - name: Generate credentials stubs
        run: |
          cp OpenEmu/ScreenScraperDevCredentials.template.swift OpenEmu/ScreenScraperDevCredentials.swift
          cp OpenEmu/OEGoogleDriveSecrets.template.swift OpenEmu/OEGoogleDriveSecrets.swift
      - name: Build OpenEmu (${{ matrix.arch }})
        working-directory: ${{github.workspace}}
        run: |
          xcodebuild \
            -workspace "OpenEmu-metal.xcworkspace" \
            -scheme "OpenEmu" \
            -configuration Release \
            -destination 'platform=macOS,arch=${{ matrix.arch }}' \
            -derivedDataPath "DerivedData-${{ matrix.arch }}" \
            ARCHS='${{ matrix.arch }}' \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO
      - name: Verify OpenEmu (${{ matrix.arch }})
        run: ./Scripts/verify-bundle-architectures.sh --arch '${{ matrix.arch }}' "DerivedData-${{ matrix.arch }}/Build/Products/Release/OpenEmu.app"
      - name: Zip OpenEmu (${{ matrix.arch }})
        working-directory: ${{github.workspace}}/DerivedData-${{ matrix.arch }}/Build/Products/Release/
        run: ditto -c -k --keepParent OpenEmu.app "OpenEmu-${{ matrix.arch }}.zip"
      - name: Upload OpenEmu (${{ matrix.arch }})
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: OpenEmu-${{ matrix.arch }}.zip
          path: ${{github.workspace}}/DerivedData-${{ matrix.arch }}/Build/Products/Release/OpenEmu-${{ matrix.arch }}.zip
