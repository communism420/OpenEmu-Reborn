name: Build Check

on:
  workflow_dispatch:
    inputs:
      package_intel:
        description: Build a downloadable OpenEmu Reborn Intel test app with all 28 native cores
        type: boolean
        default: false
      reuse_intel_run:
        description: Optional original Intel packaging run ID; rebuild only its missing inputs
        type: string
        default: ''
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  intel-test-build:
    if: inputs.package_intel == true
    uses: ./.github/workflows/intel-test-build.yml
    with:
      reuse_run: ${{ inputs.reuse_intel_run || '' }}
    permissions:
      contents: read
      actions: read

  core-sources:
    if: inputs.package_intel != true
    # Fast guard (no Xcode): catches a flattened core submodule that was
    # committed without its vendored upstream source — the regression that
    # silently broke the Dolphin build for months because CI never compiled it.
    # Runs on every PR; it takes seconds and needs no build toolchain.
    name: Core sources present
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check vendored core externals are populated
        run: ./Scripts/check-core-sources.sh

      - name: Test CI artifact provenance guards
        run: |
          python3 Scripts/Tests/test-package-ci-artifact.py
          python3 Scripts/Tests/test-package-mame-source.py
          python3 Scripts/Tests/test-prepare-core-update-release.py
          python3 Scripts/Tests/test-app-update-publication.py
          python3 Scripts/Tests/test-self-signed-update-packaging.py
          python3 Scripts/Tests/test-stage-universal-app.py
          python3 Scripts/Tests/test-release-branding.py
          python3 Scripts/Tests/test-core-artifact-reuse.py

  detect-core-changes:
    if: inputs.package_intel != true
    # The `OpenEmu` scheme only builds the main app plus its own dependencies
    # (OpenEmuKit/Base/System) — it never compiles core plugins, so a PR that
    # only touches a core could go green without a single changed line being
    # built. Figure out which cores (if any) actually need building for this
    # PR, so the core matrix below only runs what changed.
    name: Detect changed cores
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      cores: ${{ steps.detect.outputs.cores }}
      reused: ${{ steps.reuse.outputs.verified }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check evidence for unchanged core artifacts
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          # Old PR merge commits may no longer be in the current pull ref.
          # Fetch only a full source commit, never a config-supplied ref/option.
          reuse_source=$(python3 - <<'PY'
          import json, pathlib, re
          try:
              value = json.loads(pathlib.Path('.github/core-artifact-reuse.json').read_text()).get('source_sha', '')
              print(value if isinstance(value, str) and re.fullmatch(r'[0-9a-f]{40}', value) else '')
          except (OSError, ValueError, AttributeError):
              print('')
          PY
          )
          if [ -n "$reuse_source" ] && ! git cat-file -e "$reuse_source^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "$reuse_source" || echo 'Previous source unavailable; reuse will be rejected.'
          fi
          python3 Scripts/check-core-artifact-reuse.py --current-source-sha "$SOURCE_SHA" > "$RUNNER_TEMP/core-artifact-reuse.json"
          python3 - <<'PY'
          import json, os, pathlib
          report = json.loads((pathlib.Path(os.environ['RUNNER_TEMP']) / 'core-artifact-reuse.json').read_text())
          verified = report.get('reuse') is True
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('verified=' + str(verified).lower() + '\n')
          print(report['reason'])
          PY

      - name: Determine which core schemes to build
        id: detect
        run: |
          # Most cores build through the "OpenEmu + <Name>" combined scheme.
          # DeSmuME and Dolphin only have a bare "<Name>" scheme — the Build
          # step below picks the right one per core. MAME is deliberately not
          # listed here because its source is fetched and compiled by the
          # dedicated build-mame job below.
          all_cores='["4DO","Atari800","Bliss","BSNES","CrabEmu","DeSmuME","Dolphin","FCEU","Flycast","Gambatte","GenesisPlus","JollyCV","Mednafen","mGBA","Mupen64Plus","Nestopia","O2EM","Picodrive","PokeMini","Potator","PPSSPP","ProSystem","SNES9x","Stella","VecXGL","VirtualJaguar","blueMSX"]'

          # A couple of core scheme names don't match their top-level
          # directory name, so the plain "did <core>/ change" check below
          # needs an explicit override for them. (Not a bash associative
          # array — macOS's default /bin/bash is 3.2 and doesn't have them.)
          core_dirs_json='{"Potator":"Potator-Core","Picodrive":"picodrive"}'

          if [ "${{ steps.reuse.outputs.verified }}" = "true" ]; then
            # The evidence step checked all 56 prior core results and identical
            # core inputs. These are reused builds, not new successful tests.
            echo "Reusing the explicitly verified core source run"
            cores='[]'
          elif [ "${{ github.event_name }}" != "pull_request" ]; then
            # Push and workflow_dispatch runs have no PR base to diff against —
            # build every core and validate the vendored framework sources.
            echo "Not a pull_request event — building all core schemes"
            cores="$all_cores"
          else
            changed=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}")
            echo "Changed files:"
            echo "$changed"

            # A change to shared framework code, the workspace, or scheme files
            # can affect every core's build — fall back to building all of them.
            # OpenEmuKit/ is included because several cores (Gambatte, FCEU,
            # GenesisPlus, Mednafen, mGBA, Mupen64Plus, Nestopia, SNES9x, BSNES)
            # compile .m files directly out of OpenEmuKit/Source/ into their
            # own plugin targets.
            if echo "$changed" | grep -qE '^(OpenEmu-SDK/|OpenEmu-metal\.xcworkspace/|OpenEmuKit/|Scripts/)'; then
              echo "Shared code changed — building all core schemes"
              cores="$all_cores"
            else
              cores=$(CHANGED_FILES="$changed" ALL_CORES="$all_cores" CORE_DIRS="$core_dirs_json" python3 -c "
          import json, os
          all_cores = json.loads(os.environ['ALL_CORES'])
          core_dirs = json.loads(os.environ['CORE_DIRS'])
          changed = os.environ['CHANGED_FILES'].splitlines()
          selected_names = {
              c for c in all_cores
              if any(f.startswith(core_dirs.get(c, c) + '/') for f in changed)
          }

          # These plugins compile the shared rcheevos source directly into
          # their own bundle, so a Vendor/rcheevos change must rebuild them.
          if any(f.startswith('Vendor/rcheevos/') for f in changed):
              selected_names.update([
                  'BSNES', 'FCEU', 'Gambatte', 'GenesisPlus', 'Mednafen',
                  'mGBA', 'Mupen64Plus', 'Nestopia', 'SNES9x',
              ])

          selected = [c for c in all_cores if c in selected_names]
          print(json.dumps(selected))
          ")
            fi
          fi

          echo "Core schemes to build: $cores"
          echo "cores=$cores" >> "$GITHUB_OUTPUT"

      - name: Preserve core reuse evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OpenEmu-core-reuse-evidence-${{ github.run_attempt }}
          path: ${{ runner.temp }}/core-artifact-reuse.json
          if-no-files-found: warn
          retention-days: 30

  build-cores:
    name: Build core (${{ matrix.core }}, ${{ matrix.arch }})
    needs: detect-core-changes
    if: needs.detect-core-changes.outputs.cores != '[]'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        core: ${{ fromJson(needs.detect-core-changes.outputs.cores) }}
        arch: [arm64, x86_64]
        include:
          - arch: arm64
            runner: macos-26
          - arch: x86_64
            runner: macos-26-intel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.5'

      - name: Clear SPM binary artifact cache
        run: rm -rf ~/Library/Caches/org.swift.swiftpm/artifacts/

      - name: Generate credentials stubs
        run: |
          cp OpenEmu/ScreenScraperDevCredentials.template.swift OpenEmu/ScreenScraperDevCredentials.swift
          cp OpenEmu/OEGoogleDriveSecrets.template.swift OpenEmu/OEGoogleDriveSecrets.swift

      - name: Build ${{ matrix.core }} (${{ matrix.arch }})
        run: |
          # Most cores build through the "OpenEmu + <Name>" combined scheme.
          # CI verifies the host app separately, so remove only its BuildAction
          # entry from the checkout copy instead of rebuilding it for every
          # core. The scheme's LaunchAction remains unchanged for developers.
          # DeSmuME and Dolphin only have a bare "<Name>" scheme.
          case "${{ matrix.core }}" in
            DeSmuME|Dolphin) scheme="${{ matrix.core }}" ;;
            *)
              scheme="OpenEmu + ${{ matrix.core }}"
              ./Scripts/prepare-core-ci-scheme.py \
                "OpenEmu-metal.xcworkspace/xcshareddata/xcschemes/${scheme}.xcscheme"
              ;;
          esac

          xcodebuild build \
            -workspace OpenEmu-metal.xcworkspace \
            -scheme "$scheme" \
            -configuration Release \
            -destination 'platform=macOS,arch=${{ matrix.arch }}' \
            -derivedDataPath "$RUNNER_TEMP/OpenEmuDerivedData" \
            ARCHS='${{ matrix.arch }}' \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM=""

      - name: Verify core architecture (${{ matrix.arch }})
        run: |
          plugins=$(find "$RUNNER_TEMP/OpenEmuDerivedData/Build/Products" -name '*.oecoreplugin' -type d -print)
          test -n "$plugins"
          while IFS= read -r plugin; do
            ./Scripts/verify-bundle-architectures.sh --arch '${{ matrix.arch }}' "$plugin"
            codesign --verify --deep --strict "$plugin"
          done <<< "$plugins"

      - name: Package verified core with source metadata
        env:
          CORE: ${{ matrix.core }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python3 Scripts/package-ci-artifact.py \
            --kind core --name "$CORE" --arch '${{ matrix.arch }}' \
            --bundle "$RUNNER_TEMP/OpenEmuDerivedData/Build/Products/Release/$CORE.oecoreplugin" \
            --source-sha "$SOURCE_SHA" --output "$RUNNER_TEMP/CoreArtifact"

      - name: Preserve verified core (${{ matrix.core }}, ${{ matrix.arch }})
        uses: actions/upload-artifact@v4
        with:
          name: reborn-core-${{ matrix.core }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/CoreArtifact/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  build-mame:
    needs: detect-core-changes
    if: inputs.package_intel != true && needs.detect-core-changes.outputs.reused != 'true'
    # MAME's pinned source checkout is about 1 GB even when shallow, and the
    # arcade build takes substantially longer than an ordinary core. Keep it
    # out of the xcodebuild matrix so both native architectures are explicit
    # required checks and can have an appropriate timeout and source cache.
    name: Build core (MAME, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-26
          - arch: x86_64
            runner: macos-26-intel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.5'

      # Restore and save only the prepared source, before make creates any
      # architecture-specific objects. Separate keys avoid concurrent cache
      # writers and ensure an Intel build can never inherit ARM intermediates.
      - name: Restore prepared MAME source
        id: mame-source-cache
        uses: actions/cache/restore@v4
        with:
          path: MAME/deps/mame
          key: mame-source-v1-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('MAME/deps-mame-revision.txt', 'MAME/patches/**', 'Scripts/prepare-mame-core.sh') }}

      - name: Prepare MAME source
        run: |
          ./Scripts/prepare-mame-core.sh
          du -sh MAME/deps/mame
          df -h "$RUNNER_TEMP"

      - name: Save prepared MAME source
        if: steps.mame-source-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: MAME/deps/mame
          key: ${{ steps.mame-source-cache.outputs.cache-primary-key }}

      # The upstream MAME checkout is not in GitHub's automatic Reborn source
      # archive. Preserve it once, before any architecture-specific build.
      - name: Package pinned MAME source and applied patch
        if: matrix.arch == 'arm64'
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python3 Scripts/package-mame-source.py \
            --source-sha "$SOURCE_SHA" \
            --mame-source "$GITHUB_WORKSPACE/MAME/deps/mame" \
            --output "$RUNNER_TEMP/MAMESourceArtifact"

      - name: Build MAME (${{ matrix.arch }})
        # A one-commit checkout has no reachable tag for `git describe`.
        # MAME supports IGNORE_GIT for this case; the core's version remains
        # the pinned 0.250 value from its project and Info.plist.
        env:
          IGNORE_GIT: '1'
        run: ./Scripts/build-mame-core.sh --arch '${{ matrix.arch }}'

      - name: Verify MAME architecture (${{ matrix.arch }})
        run: |
          plugin=MAME/build/XcodeDerived/Build/Products/Release/MAME.oecoreplugin
          ./Scripts/verify-bundle-architectures.sh --arch '${{ matrix.arch }}' "$plugin"
          codesign --verify --deep --strict "$plugin"

      - name: Package verified MAME with source metadata
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python3 Scripts/package-ci-artifact.py \
            --kind core --name MAME --arch '${{ matrix.arch }}' \
            --bundle "$GITHUB_WORKSPACE/MAME/build/XcodeDerived/Build/Products/Release/MAME.oecoreplugin" \
            --source-sha "$SOURCE_SHA" --output "$RUNNER_TEMP/CoreArtifact"

      - name: Preserve verified MAME (${{ matrix.arch }})
        uses: actions/upload-artifact@v4
        with:
          name: reborn-core-MAME-${{ matrix.arch }}
          path: ${{ runner.temp }}/CoreArtifact/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Preserve pinned source for the verified MAME build
        if: matrix.arch == 'arm64'
        uses: actions/upload-artifact@v4
        with:
          name: reborn-mame-source
          path: ${{ runner.temp }}/MAMESourceArtifact/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  build-vendor-frameworks:
    if: inputs.package_intel != true
    name: Build vendor frameworks (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-26
          - arch: x86_64
            runner: macos-26-intel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.5'

      - name: Build XADMaster and UniversalDetector (Release, ${{ matrix.arch }})
        run: |
          xcodebuild build \
            -project Vendor/XADMaster/XADMaster.xcodeproj \
            -scheme XADMaster \
            -configuration Release \
            -destination 'platform=macOS,arch=${{ matrix.arch }}' \
            -derivedDataPath "$RUNNER_TEMP/VendorDerivedData" \
            ARCHS='${{ matrix.arch }}' \
            ONLY_ACTIVE_ARCH=YES \
            MACOSX_DEPLOYMENT_TARGET=11.0 \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM=""

      - name: Verify vendor framework architectures (${{ matrix.arch }})
        run: |
          for framework in XADMaster UniversalDetector; do
            bundle="$RUNNER_TEMP/VendorDerivedData/Build/Products/Release/$framework.framework"
            ./Scripts/verify-bundle-architectures.sh --arch '${{ matrix.arch }}' "$bundle"
            codesign --verify --deep --strict "$bundle"
          done

      - name: Run XADMasterTests (${{ matrix.arch }})
        run: |
          xcodebuild test \
            -project Vendor/XADMaster/XADMaster.xcodeproj \
            -scheme XADMaster \
            -configuration Debug \
            -destination 'platform=macOS,arch=${{ matrix.arch }}' \
            -derivedDataPath "$RUNNER_TEMP/VendorDerivedData" \
            ARCHS='${{ matrix.arch }}' \
            ONLY_ACTIVE_ARCH=YES \
            MACOSX_DEPLOYMENT_TARGET=11.0 \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM=""

  build-auxiliary-tools:
    if: inputs.package_intel != true
    # These release tools and public SPIR-V schemes are not dependencies of
    # the main OpenEmu scheme, so verify them explicitly on both native CPUs.
    name: Build auxiliary tools (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-26
          - arch: x86_64
            runner: macos-26-intel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.5'

      - name: Clear SPM binary artifact cache
        run: rm -rf ~/Library/Caches/org.swift.swiftpm/artifacts/

      - name: Build auxiliary targets (Release, ${{ matrix.arch }})
        run: |
          product_root="$RUNNER_TEMP/AuxiliaryBuild"
          object_root="$RUNNER_TEMP/AuxiliaryIntermediates"
          common_settings=(
            -configuration Release
            -sdk macosx
            ARCHS='${{ matrix.arch }}'
            ONLY_ACTIVE_ARCH=YES
            SYMROOT="$product_root"
            OBJROOT="$object_root"
            CODE_SIGN_STYLE=Manual
            CODE_SIGN_IDENTITY="-"
            CODE_SIGNING_REQUIRED=NO
            CODE_SIGNING_ALLOWED=YES
            DEVELOPMENT_TEAM=""
          )

          # These products have targets but no shared schemes.
          xcodebuild build \
            -project OpenEmu/OpenEmu.xcodeproj \
            -target OECoreListUpdater \
            "${common_settings[@]}"

          xcodebuild build \
            -project OpenEmu/OpenEmu.xcodeproj \
            -target OEAlertTest \
            "${common_settings[@]}"

          shader_project=OpenEmu-Shaders/OpenEmuShaders.xcodeproj
          xcodebuild build \
            -workspace OpenEmu-metal.xcworkspace \
            -scheme OpenEmuShaders \
            -destination 'platform=macOS,arch=${{ matrix.arch }}' \
            "${common_settings[@]}" \
            MACOSX_DEPLOYMENT_TARGET=11.0

          xcodebuild build \
            -project "$shader_project" \
            -target oeshaders \
            "${common_settings[@]}" \
            MACOSX_DEPLOYMENT_TARGET=11.0

          spirv_project=OpenEmu-Shaders/3rdparty/SPIRV/SPIRV.xcodeproj
          xcodebuild build \
            -project "$spirv_project" \
            -target SPIRVCross \
            "${common_settings[@]}" \
            MACOSX_DEPLOYMENT_TARGET=11.0

          # Build the three shared macOS schemes that are not reached by the
          # OpenEmuShaders framework target. Reuse products and intermediates
          # from the oeshaders build to avoid recompiling their C libraries.
          for scheme in GLSLang SPIRVTools testcli; do
            xcodebuild build \
              -project "$spirv_project" \
              -scheme "$scheme" \
              -destination 'platform=macOS,arch=${{ matrix.arch }}' \
              "${common_settings[@]}" \
              MACOSX_DEPLOYMENT_TARGET=11.0
          done

      - name: Verify auxiliary architectures (${{ matrix.arch }})
        run: |
          release_dir="$RUNNER_TEMP/AuxiliaryBuild/Release"
          for product in \
            OECoreListUpdater \
            oeshaders \
            libGLSLang.a \
            libSPIRVCross.a \
            libSPIRVTools.a \
            testcli
          do
            product_path="$release_dir/$product"
            test -f "$product_path"
            lipo "$product_path" -verify_arch '${{ matrix.arch }}'
          done

          # The shader tools bring framework dependencies into this product
          # tree. Check the primary products, then every embedded copy.
          for framework in OpenEmuShaders SPIRV; do
            test -d "$release_dir/$framework.framework"
          done
          ./Scripts/verify-bundle-architectures.sh \
            --arch '${{ matrix.arch }}' \
            "$release_dir/OEAlertTest.app"
          framework_count=0
          while IFS= read -r framework_path; do
            ./Scripts/verify-bundle-architectures.sh \
              --arch '${{ matrix.arch }}' \
              "$framework_path"
            framework_count=$((framework_count + 1))
          done < <(find "$RUNNER_TEMP/AuxiliaryBuild" -type d -name '*.framework' -print)
          test "$framework_count" -ge 2

      - name: Verify auxiliary code signatures
        run: |
          release_dir="$RUNNER_TEMP/AuxiliaryBuild/Release"
          for executable in OECoreListUpdater oeshaders testcli; do
            codesign --verify --strict "$release_dir/$executable"
          done
          codesign --verify --deep --strict "$release_dir/OEAlertTest.app"
          framework_count=0
          while IFS= read -r framework_path; do
            codesign --verify --deep --strict "$framework_path"
            framework_count=$((framework_count + 1))
          done < <(find "$RUNNER_TEMP/AuxiliaryBuild" -type d -name '*.framework' -print)
          test "$framework_count" -ge 2

  build:
    if: inputs.package_intel != true
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-26
          - arch: x86_64
            runner: macos-26-intel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.5'

      - name: Clear SPM binary artifact cache
        run: rm -rf ~/Library/Caches/org.swift.swiftpm/artifacts/

      - name: Generate credentials stubs
        run: |
          cp OpenEmu/ScreenScraperDevCredentials.template.swift OpenEmu/ScreenScraperDevCredentials.swift
          cp OpenEmu/OEGoogleDriveSecrets.template.swift OpenEmu/OEGoogleDriveSecrets.swift

      - name: Test selected data folder and settings (${{ matrix.arch }})
        run: |
          ./Scripts/Tests/test-storage-sdk.sh
          ./Scripts/Tests/test-data-folder-setup.sh
          python3 ./Scripts/Tests/test-core-data-folder.py
          ./Mednafen/Tests/test-generated-playlists.sh

      - name: Build OpenEmu (Debug, ${{ matrix.arch }})
        run: |
          xcodebuild build \
            -workspace OpenEmu-metal.xcworkspace \
            -scheme OpenEmu \
            -configuration Debug \
            -destination 'platform=macOS,arch=${{ matrix.arch }}' \
            -derivedDataPath "$RUNNER_TEMP/OpenEmuDerivedData" \
            ARCHS='${{ matrix.arch }}' \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM=""

      - name: Verify app architecture (Debug, ${{ matrix.arch }})
        run: ./Scripts/verify-bundle-architectures.sh --arch '${{ matrix.arch }}' "$RUNNER_TEMP/OpenEmuDerivedData/Build/Products/Debug/OpenEmu.app"

      - name: Analyze OpenEmu (Debug, ${{ matrix.arch }})
        run: |
          xcodebuild analyze \
            -workspace OpenEmu-metal.xcworkspace \
            -scheme OpenEmu \
            -configuration Debug \
            -destination 'platform=macOS,arch=${{ matrix.arch }}' \
            -derivedDataPath "$RUNNER_TEMP/OpenEmuDerivedData" \
            ARCHS='${{ matrix.arch }}' \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM=""

      - name: Build OpenEmu (Release, ${{ matrix.arch }})
        run: |
          xcodebuild build \
            -workspace OpenEmu-metal.xcworkspace \
            -scheme OpenEmu \
            -configuration Release \
            -destination 'platform=macOS,arch=${{ matrix.arch }}' \
            -derivedDataPath "$RUNNER_TEMP/OpenEmuDerivedData" \
            ARCHS='${{ matrix.arch }}' \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM=""

      - name: Verify app architecture (Release, ${{ matrix.arch }})
        run: ./Scripts/verify-bundle-architectures.sh --arch '${{ matrix.arch }}' "$RUNNER_TEMP/OpenEmuDerivedData/Build/Products/Release/OpenEmu.app"

      - name: Test authenticated core updates (${{ matrix.arch }})
        run: |
          frameworks="$RUNNER_TEMP/OpenEmuDerivedData/Build/Products/Release"
          bash Scripts/Tests/test-core-update-security.sh "$frameworks"
          bash Scripts/Tests/test-core-update-installation.sh "$frameworks"
          bash Scripts/Tests/test-core-update-checks.sh "$frameworks"
          python3 Scripts/Tests/test-update-signature.py
          python3 Scripts/Tests/test-merge-ci-bundle.py
          python3 Scripts/Tests/test-reborn-app-branding.py \
            --app "$frameworks/OpenEmu.app"

      - name: Build auxiliary tools (Release, ${{ matrix.arch }})
        run: |
          xcodebuild build \
            -project OpenEmu/OpenEmu.xcodeproj \
            -scheme OEControlLabelsGenerator \
            -configuration Release \
            -destination 'platform=macOS,arch=${{ matrix.arch }}' \
            -derivedDataPath "$RUNNER_TEMP/OpenEmuDerivedData" \
            ARCHS='${{ matrix.arch }}' \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM=""

          tool="$RUNNER_TEMP/OpenEmuDerivedData/Build/Products/Release/OEControlLabelsGenerator"
          lipo "$tool" -verify_arch '${{ matrix.arch }}'
          codesign --verify --strict "$tool"

      - name: Validate metadata and code signatures (${{ matrix.arch }})
        run: |
          plutil -lint \
            OpenEmu/OpenEmu-Info.plist \
            OpenEmu/OpenEmu.entitlements \
            OpenEmu/OpenEmuHelperApp/OpenEmuHelperApp-Info.plist \
            OpenEmu/OpenEmuHelperApp/OpenEmuHelperApp.entitlements

          for configuration in Debug Release; do
            app="$RUNNER_TEMP/OpenEmuDerivedData/Build/Products/$configuration/OpenEmu.app"
            codesign --verify --deep --strict "$app"
          done

      - name: Smoke-test app data folder (Release, ${{ matrix.arch }})
        timeout-minutes: 5
        run: |
          set -euo pipefail
          # The harness refuses other running app instances and terminates
          # only its own processes before component tests start.
          ./Scripts/Tests/test-data-folder-app.sh \
            "$RUNNER_TEMP/OpenEmuDerivedData/Build/Products/Release/OpenEmu.app" \
            2>&1 | tee "$RUNNER_TEMP/app-data-folder-smoke.log"

      - name: Upload app data-folder smoke logs (${{ matrix.arch }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OpenEmu-data-folder-smoke-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/app-data-folder-smoke.log
            /private/tmp/openemu-data-folder-app-*/*.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Run component tests (${{ matrix.arch }})
        id: component_tests
        run: |
          failures=0
          results_dir="$RUNNER_TEMP/ComponentTestResults-${{ matrix.arch }}-${{ github.run_attempt }}"
          mkdir -p "$results_dir"

          run_tests() {
            container_kind="$1"
            container_path="$2"
            scheme="$3"

            echo "Testing $scheme (${{ matrix.arch }})"
            if ! xcodebuild test \
              "-$container_kind" "$container_path" \
              -scheme "$scheme" \
              -configuration Debug \
              -destination 'platform=macOS,arch=${{ matrix.arch }}' \
              -derivedDataPath "$RUNNER_TEMP/OpenEmuDerivedData" \
              -resultBundlePath "$results_dir/$scheme.xcresult" \
              ARCHS='${{ matrix.arch }}' \
              ONLY_ACTIVE_ARCH=YES \
              CODE_SIGN_STYLE=Manual \
              CODE_SIGN_IDENTITY="-" \
              CODE_SIGNING_ALLOWED=YES \
              CODE_SIGNING_REQUIRED=NO \
              DEVELOPMENT_TEAM=""; then
              failures=$((failures + 1))
            fi
          }

          run_tests workspace OpenEmu-metal.xcworkspace OpenEmu
          run_tests project OpenEmuKit/OpenEmuKit.xcodeproj OpenEmuKit
          run_tests project OpenEmu-SDK/OpenEmu-SDK.xcodeproj OpenEmuBase
          run_tests project OpenEmu-SDK/OpenEmu-SDK.xcodeproj OpenEmuSystem
          run_tests project OpenEmu-Shaders/OpenEmuShaders.xcodeproj OpenEmuShaders

          if [ "$failures" -ne 0 ]; then
            echo "::error::$failures component test scheme(s) failed"
            exit 1
          fi

      # Preserve XCTest diagnostics even when the test step fails or times out.
      # Only the five result bundles are uploaded, never DerivedData/products.
      - name: Preserve failed component test results (${{ matrix.arch }})
        if: ${{ always() && (steps.component_tests.outcome == 'failure' || steps.component_tests.outcome == 'cancelled') }}
        uses: actions/upload-artifact@v4
        with:
          name: OpenEmu-component-test-results-${{ matrix.arch }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ComponentTestResults-${{ matrix.arch }}-${{ github.run_attempt }}/*.xcresult
          if-no-files-found: warn
          retention-days: 14

      - name: Package verified Release host with source metadata
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python3 Scripts/package-ci-artifact.py \
            --kind host --name OpenEmu --arch '${{ matrix.arch }}' \
            --bundle "$RUNNER_TEMP/OpenEmuDerivedData/Build/Products/Release/OpenEmu.app" \
            --source-sha "$SOURCE_SHA" --output "$RUNNER_TEMP/HostArtifact"

      - name: Preserve verified Release host (${{ matrix.arch }})
        uses: actions/upload-artifact@v4
        with:
          name: reborn-host-${{ matrix.arch }}
          path: ${{ runner.temp }}/HostArtifact/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Build universal Release host (no emulator cores)
        if: matrix.arch == 'arm64'
        run: |
          # Preserve the tested thin host above before reusing its build cache.
          # Xcode builds the host and its dependencies for both CPUs together,
          # including architecture-sensitive Metal and asset-catalog resources.
          # The OpenEmu scheme does not build native emulator core plugins.
          xcodebuild build \
            -workspace OpenEmu-metal.xcworkspace \
            -scheme OpenEmu \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/OpenEmuDerivedData" \
            ARCHS='arm64 x86_64' \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM=""

      - name: Verify and package universal Release host
        if: matrix.arch == 'arm64'
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          app="$RUNNER_TEMP/OpenEmuDerivedData/Build/Products/Release/OpenEmu.app"
          for architecture in arm64 x86_64; do
            ./Scripts/verify-bundle-architectures.sh --arch "$architecture" "$app"
          done
          codesign --verify --deep --strict "$app"
          python3 Scripts/package-ci-artifact.py \
            --kind host --name OpenEmu --arch universal \
            --bundle "$app" --source-sha "$SOURCE_SHA" \
            --output "$RUNNER_TEMP/UniversalHostArtifact"

      - name: Preserve verified universal Release host
        if: matrix.arch == 'arm64'
        uses: actions/upload-artifact@v4
        with:
          name: reborn-host-universal
          path: ${{ runner.temp }}/UniversalHostArtifact/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
